<main id="main">
<section class="section">
  <h1>Contact me</h1>
  <p class="measure lead">Have a question or an opportunity? Send a message and I'll reply within two days.</p>
  <form id="contact-form" class="stack" novalidate>
    <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"><span class="error" data-for="name"></span></div>
    <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email"><span class="error" data-for="email"></span></div>
    <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel"><span class="error" data-for="phone"></span></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="error" data-for="message"></span></div>
    <button class="btn" type="submit">Send message</button>
    <p id="form-success" class="success" role="status"></p>
  </form>
</section>
</main>
